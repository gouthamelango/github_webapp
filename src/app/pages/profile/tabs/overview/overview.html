<div>
    <div class="overview-container d-flex justify-content-between gap-3">
        <p>Pinned</p>
        <a>Customize your pins</a>
    </div>

    <div *ngIf="repositories() as repositories" class="repo-grid">
        <app-repo-card *ngFor="let eachRepository of repositories" [repository]="eachRepository"></app-repo-card>
    </div>


    <p>2,310 contributions in the last year</p>
    <div class="row">
        <div class="col-lg-10 col-sm-12">
            <div class="row">
                <div class="col-12">
                    <app-contibution-graph [contributions]="contributionData"></app-contibution-graph>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-6 col-sm-12">
                    <h6>Activity overview</h6>
                </div>
                <div class="col-lg-6 col-sm-12">
                    <app-radar-graph></app-radar-graph>
                </div>
            </div>
        </div>
        <div class="col-2">
            <div class="year-picker overflow-auto">
                <div class="list-group">
                    <button type="button" class="list-group-item list-group-item-action active rounded mb-2">
                        2026
                    </button>

                    <button type="button" class="list-group-item list-group-item-action border-0">
                        2025
                    </button>

                    <button type="button" class="list-group-item list-group-item-action border-0">
                        2024
                    </button>

                    <button type="button" class="list-group-item list-group-item-action border-0">
                        2023
                    </button>

                    <button type="button" class="list-group-item list-group-item-action border-0">
                        2022
                    </button>

                    <button type="button" class="list-group-item list-group-item-action border-0">
                        2021
                    </button>
                </div>
            </div>
        </div>
    </div>

</div>
