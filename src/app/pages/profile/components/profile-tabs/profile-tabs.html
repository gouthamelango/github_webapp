<div class="container p-2">
    @switch(selectedTab()) {

                @case('overview') {
                    <app-overview [githubUsername]="githubUsername"></app-overview>
                }

                @case('repositories') {
                    <app-repositories></app-repositories>
                }

                @case('projects') {
                    <app-projects></app-projects>
                }

                @case('packages') {
                    <app-packages></app-packages>
                }

                @case('stars') {
                    <app-stars></app-stars>
                }

            }
</div>
