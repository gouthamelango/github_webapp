<div class="repo-card-container border p-2 rounded-2 d-flex flex-column">
    <div class="repo-card-title d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <i class="bi bi-journal-bookmark"></i>
            <a href="">{{repository.name}}</a>
        </div>
        <div class="badge rounded-pill ms-1 repo-card-repo-badge border">
            {{repository.private ? 'Private' : 'Public'}}
        </div>
    </div>

    <div class="repo-card-description mt-2 flex-grow-1">
        <p>{{repository.description}}</p>
    </div>

    <div *ngIf="repository.language" class="d-flex align-items-center gap-1 mt-2 repo-card-language">
        <span class="lang-dot" [style.background-color]="getLanguageColor()"></span>
        <span>{{repository.language}}</span>
    </div>
</div>
