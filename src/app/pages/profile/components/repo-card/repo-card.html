<div class="repo-card-container border m-1 p-2 rounded-2">
    
    <div class="repo-card-title d-flex justify-content-between align-items-center">
        <div class="d-flex justify-content gap-2">
            <i class="bi bi-journal-bookmark"></i>
            <a href="">{{repository.name}}</a>
            <div class="badge rounded-pill ms-1 repo-card-repo-badge border">
                {{repository.private ?  'Private' : 'Public'}}
            </div>
        </div>
        <div>
            <i class="bi bi-grip-vertical"></i>
        </div>
    </div>

    <div class="repo-card-description mt-2">
        <p>{{repository.description}}</p>
    </div>
</div>
